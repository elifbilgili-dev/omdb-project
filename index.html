
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMDB Movie Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>OMDB Movie Search</h1>

    <div class="search-box">
      <input type="text" id="movieInput" placeholder="Enter movie name" />
      <button id="searchBtn">Search</button>
    </div>

    <p id="message"></p>

    <div id="movieCard" class="movie-card hidden">
      <img id="moviePoster" src="" alt="Movie Poster" />
      
      <div class="movie-info">
        <h2 id="movieTitle"></h2>
        <p><strong>Year:</strong> <span id="movieYear"></span></p>
        <p><strong>Genre:</strong> <span id="movieGenre"></span></p>
        <p><strong>Director:</strong> <span id="movieDirector"></span></p>
        <p class="rating-line">
  <strong>IMDb Rating:</strong>
  <span id="movieRating" class="rating-badge"></span>
</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
